<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XEROXIC — Interactive Presentation Video & Architecture Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --ink: #f9fafb;
      --muted: #94a3b8;
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-light: #34d399;
      --accent: #6366f1;
      --gold: #f59e0b;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Outfit', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Ambient Background Glow */
    .glow-circle {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { top: -10%; left: 10%; width: 500px; height: 500px; background: #10b981; }
    .glow-2 { bottom: -10%; right: 10%; width: 600px; height: 600px; background: #6366f1; }

    /* Main Container */
    .video-studio {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1120px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Studio Header */
    .studio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 4px 6px;
    }

    .studio-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .studio-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--ink);
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .pill-btn.primary {
      background: linear-gradient(135deg, #10b981, #047857);
      border: none;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .pill-btn.primary:hover {
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }

    /* Screen Wrapper */
    .screen-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    canvas#videoCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* Overlay Overlay Screen */
    .overlay-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-tag {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #a7f3d0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Big Center Play Watermark */
    .play-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.5);
      transition: all 0.25s ease;
      z-index: 15;
    }

    .play-watermark:hover {
      transform: translate(-50%, -50%) scale(1.1);
      background: #10b981;
    }

    .play-watermark.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.8);
    }

    /* Player Controls Bar */
    .player-controls {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .time-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      min-width: 85px;
    }

    .seek-slider {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--ink);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .icon-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Scene Shortcuts Navigation */
    .scene-selector {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .scene-selector::-webkit-scrollbar { display: none; }

    .scene-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .scene-chip:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
    }

    .scene-chip.active {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--primary);
      color: var(--primary-light);
    }

    /* Recording Badge */
    .rec-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 5px 12px;
      border-radius: 999px;
      display: none;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulseDot 1s infinite;
    }

    /* Presentation Notes Accordion */
    .notes-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .notes-title {
      font-size: 14px;
      font-weight: 700;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notes-text {
      font-size: 13.5px;
      line-height: 1.6;
      color: #94a3b8;
    }

    .notes-text strong {
      color: #f1f5f9;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="glow-circle glow-1"></div>
  <div class="glow-circle glow-2"></div>

  <div class="video-studio">
    <!-- Header -->
    <div class="studio-header">
      <div class="studio-brand">
        <span class="brand-badge">⚡ XEROXIC STUDIO</span>
        <div>
          <div class="brand-title">Smart Campus Video Demonstration</div>
          <div class="brand-sub">End-to-End Workflow with Synthesizer Music &amp; Smooth Ken Burns Zoom</div>
        </div>
      </div>

      <div class="studio-actions">
        <a href="/" class="pill-btn">← Back to App</a>
        <button id="exportBtn" class="pill-btn primary">
          <span>⬇ Export Video (MP4/WebM)</span>
        </button>
      </div>
    </div>

    <!-- Screen Wrapper -->
    <div class="screen-wrapper" id="screenWrapper">
      <canvas id="videoCanvas" width="1280" height="720"></canvas>

      <!-- HUD Top Overlay -->
      <div class="overlay-hud">
        <div class="hud-tag">
          <div class="hud-dot"></div>
          <span id="sceneTitle">Scene 1: Platform Overview</span>
        </div>
        <div class="rec-status" id="recBadge">
          <div class="rec-dot"></div>
          <span>RECORDING MP4/WEBM...</span>
        </div>
        <div class="hud-tag" style="color:#e2e8f0; font-family:'JetBrains Mono', monospace; font-size:11px;">
          <span id="fpsBadge">60 FPS</span> • <span>v3.0.0 Cloud</span>
        </div>
      </div>

      <!-- Play Watermark (Initial Click) -->
      <div class="play-watermark" id="centerPlayBtn" title="Click to Play Presentation Video">
        ▶
      </div>
    </div>

    <!-- Controls Bar -->
    <div class="player-controls">
      <!-- Progress Bar -->
      <div class="progress-row">
        <span class="time-readout" id="timeDisplay">00:00 / 01:45</span>
        <input type="range" class="seek-slider" id="seekSlider" min="0" max="105" step="0.1" value="0">
      </div>

      <!-- Buttons Row -->
      <div class="controls-row">
        <div class="ctrl-group">
          <button class="icon-btn" id="playBtn" title="Play / Pause">▶</button>
          <button class="icon-btn" id="rewindBtn" title="Rewind to Start">⏮</button>
          <button class="icon-btn" id="musicToggleBtn" title="Toggle Music" class="active">🎵</button>
          <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.75" style="width:70px; accent-color:var(--primary);" title="Music Volume">
        </div>

        <!-- Scene Shortcuts -->
        <div class="scene-selector" id="sceneChipsContainer">
          <!-- Populated by JS -->
        </div>

        <div class="ctrl-group">
          <button class="icon-btn" id="fullscreenBtn" title="Toggle Fullscreen">⛶</button>
        </div>
      </div>
    </div>

    <!-- Live Presenter Speaker Notes -->
    <div class="notes-card">
      <div class="notes-title">
        <span>🎤 Presenter Script &amp; Technical Talking Points:</span>
      </div>
      <div class="notes-text" id="speakerNotesText">
        Loading presentation script...
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       XEROXIC VIDEO DEMONSTRATION ENGINE
       - Ken Burns Dynamic Camera Engine (Zoom In / Out / Pan)
       - Web Audio API Synthesizer Soundtrack & Synchronized SFX
       - Canvas 2D Realistic High-Fidelity App Mockup Renderer
       - Native MediaRecorder Canvas + Audio Export Engine
       ========================================================================= */

    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1280;
    const H = 720;

    // UI Elements
    const playBtn = document.getElementById('playBtn');
    const centerPlayBtn = document.getElementById('centerPlayBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const seekSlider = document.getElementById('seekSlider');
    const timeDisplay = document.getElementById('timeDisplay');
    const sceneTitle = document.getElementById('sceneTitle');
    const sceneChipsContainer = document.getElementById('sceneChipsContainer');
    const speakerNotesText = document.getElementById('speakerNotesText');
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const volSlider = document.getElementById('volSlider');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const exportBtn = document.getElementById('exportBtn');
    const recBadge = document.getElementById('recBadge');

    // SCENES DEFINITIONS (Total: 105 seconds = 1m 45s)
    const SCENES = [
      {
        id: 'intro',
        name: '1. Title & Intro',
        start: 0,
        end: 10,
        speaker: 'Respected professors and colleagues: Welcome to Xeroxic, the cloud-native smart campus printing platform for Army Institute of Technology, Pune. It completely eliminates physical printing queues and pendrive malware.',
        cam: { from: { x: W/2, y: H/2, zoom: 0.95 }, to: { x: W/2, y: H/2, zoom: 1.05 } }
      },
      {
        id: 'student_login',
        name: '2. Student Login',
        start: 10,
        end: 22,
        speaker: 'Students sign in securely with HMAC-SHA256 password hashing and role-based access control. No clunky registration; fast single-tap authentication from any phone or dorm PC.',
        cam: { from: { x: W/2, y: H/2, zoom: 1.0 }, to: { x: W/2, y: H/2 + 20, zoom: 1.25 } }
      },
      {
        id: 'upload_supabase',
        name: '3. Supabase 50MB Upload',
        start: 22,
        end: 36,
        speaker: 'Documents up to 50MB stream directly to Supabase Cloud Object Storage using pre-authenticated signed URLs. This completely bypasses Vercel 4.5MB serverless limits with zero backend RAM bloat.',
        cam: { from: { x: 400, y: 380, zoom: 1.15 }, to: { x: 420, y: 360, zoom: 1.35 } }
      },
      {
        id: 'print_options',
        name: '4. Print Options & Price',
        start: 36,
        end: 48,
        speaker: 'Dynamic in-browser pricing engine. As the student chooses Duplex printing, Color pages, and Spiral Binding, the price updates dynamically in real-time with zero ambiguity.',
        cam: { from: { x: 750, y: 360, zoom: 1.1 }, to: { x: 760, y: 350, zoom: 1.32 } }
      },
      {
        id: 'payment_id',
        name: '5. Razorpay & Memorable ID',
        start: 48,
        end: 62,
        speaker: 'Razorpay UPI checkout verifies payment with server-side HMAC signatures. Notice the generated Order ID: "sumit24001" (first 5 letters of email + date + 3-digit serial). Short names are padded with # (e.g. ali##24001).',
        cam: { from: { x: W/2, y: H/2, zoom: 1.0 }, to: { x: W/2, y: 340, zoom: 1.45 } }
      },
      {
        id: 'admin_desk',
        name: '6. Admin Portal Live Order',
        start: 62,
        end: 74,
        speaker: 'Switching to the Shop Admin Desk! The verified order appears instantly in the operator queue with zero delay, ready with download links and full print configurations.',
        cam: { from: { x: W/2, y: H/2, zoom: 1.05 }, to: { x: 500, y: 380, zoom: 1.28 } }
      },
      {
        id: 'admin_status',
        name: '7. 0ms Status Progression',
        start: 74,
        end: 84,
        speaker: 'Atomic status progression: The operator clicks "Start Printing", then "Mark Ready". Thanks to optimistic UI synchronization, status transitions update in 0ms without page reloads!',
        cam: { from: { x: 680, y: 390, zoom: 1.25 }, to: { x: 720, y: 400, zoom: 1.48 } }
      },
      {
        id: 'express_qr',
        name: '8. ⚡ Express QR Pickup Pass',
        start: 84,
        end: 94,
        speaker: 'On the student device, the screen lights up with an Express QR Pickup Pass. The student walks to the shop counter, the operator scans the QR code in 1 second, and the physical printout is handed over!',
        cam: { from: { x: W/2, y: H/2, zoom: 1.1 }, to: { x: W/2, y: 360, zoom: 1.4 } }
      },
      {
        id: 'superadmin',
        name: '9. Super Admin & Purge',
        start: 94,
        end: 101,
        speaker: 'Zero-retention privacy engine: The document binary is permanently shredded from cloud storage upon collection. The Super Admin manages student profiles, 10-order rolling history, and monthly ledger renewals.',
        cam: { from: { x: W/2, y: H/2, zoom: 1.0 }, to: { x: W/2, y: 400, zoom: 1.22 } }
      },
      {
        id: 'outro',
        name: '10. Summary & Credits',
        start: 101,
        end: 105,
        speaker: 'Xeroxic v3.0.0 is live and deployed on Vercel Edge + MongoDB Atlas + Supabase Storage. Engineered with precision by Sumit Jangra for Army Institute of Technology, Pune.',
        cam: { from: { x: W/2, y: H/2, zoom: 1.15 }, to: { x: W/2, y: H/2, zoom: 0.98 } }
      }
    ];

    const TOTAL_DURATION = 105; // seconds
    let currentTime = 0;
    let isPlaying = false;
    let lastTimestamp = 0;
    let musicEnabled = true;

    // Render Scene Chips
    SCENES.forEach((sc, i) => {
      const chip = document.createElement('div');
      chip.className = `scene-chip ${i === 0 ? 'active' : ''}`;
      chip.textContent = sc.name;
      chip.addEventListener('click', () => {
        jumpToTime(sc.start);
      });
      sceneChipsContainer.appendChild(chip);
    });

    // Helper: current scene
    function getCurrentScene(time) {
      return SCENES.find(s => time >= s.start && time < s.end) || SCENES[SCENES.length - 1];
    }

    // Helper: lerp
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }
    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    /* =========================================================================
       AUDIO SYNTHESIZER ENGINE (Web Audio API)
       Modern Synthwave / Tech-House Campus Beat
       ========================================================================= */
    let audioCtx = null;
    let masterGain = null;
    let audioDestNode = null;
    let synthTimer = null;
    let stepCount = 0;

    function initAudio() {
      if (audioCtx) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(parseFloat(volSlider.value), audioCtx.currentTime);
      masterGain.connect(audioCtx.destination);

      // Create destination for MediaRecorder export
      audioDestNode = audioCtx.createMediaStreamDestination();
      masterGain.connect(audioDestNode);

      // 124 BPM electronic sequencer
      const stepInterval = (60 / 124) / 4; // 16th note
      setInterval(playSynthStep, stepInterval * 1000);
    }

    // Bass notes in A minor
    const bassline = [110, 110, 130.81, 110, 98, 98, 123.47, 98, 87.31, 87.31, 110, 87.31, 98, 98, 110, 123.47];
    // Arp notes
    const arpNotes = [440, 523.25, 659.25, 880, 523.25, 659.25, 783.99, 659.25];

    function playSynthStep() {
      if (!isPlaying || !musicEnabled || !audioCtx || audioCtx.state !== 'running') return;
      const t = audioCtx.currentTime;
      const step = stepCount % 16;
      stepCount++;

      // 1. Kick Drum on beats 0, 4, 8, 12
      if (step % 4 === 0) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(38, t + 0.09);
        g.gain.setValueAtTime(0.7, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(t);
        osc.stop(t + 0.23);
      }

      // 2. Crisp Hi-Hat on off-beats 2, 6, 10, 14 and 16ths
      if (step % 2 === 0) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'highpass';
        osc.frequency.setValueAtTime(7000 + Math.random() * 1500, t);
        g.gain.setValueAtTime(step % 4 === 2 ? 0.12 : 0.04, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(t);
        osc.stop(t + 0.045);
      }

      // 3. Melodic Bassline
      if (step % 2 === 0) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(bassline[step] / 2, t);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, t);
        filter.frequency.exponentialRampToValueAtTime(120, t + 0.12);
        g.gain.setValueAtTime(0.25, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        osc.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        osc.start(t);
        osc.stop(t + 0.15);
      }

      // 4. Arpeggiated Sparkle Lead
      const arpFreq = arpNotes[(stepCount) % arpNotes.length];
      const leadOsc = audioCtx.createOscillator();
      const leadGain = audioCtx.createGain();
      leadOsc.type = 'triangle';
      leadOsc.frequency.setValueAtTime(arpFreq, t);
      leadGain.gain.setValueAtTime(0.12, t);
      leadGain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      leadOsc.connect(leadGain);
      leadGain.connect(masterGain);
      leadOsc.start(t);
      leadOsc.stop(t + 0.13);
    }

    // Sound FX: Chime / Pop / Scan
    function playSfx(type) {
      if (!audioCtx || !musicEnabled) return;
      const t = audioCtx.currentTime;
      if (type === 'click') {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(400, t + 0.03);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(t);
        osc.stop(t + 0.035);
      } else if (type === 'payment') {
        // Double ding
        [587.33, 880].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + idx * 0.1);
          g.gain.setValueAtTime(0.25, t + idx * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.1 + 0.4);
          osc.connect(g);
          g.connect(masterGain);
          osc.start(t + idx * 0.1);
          osc.stop(t + idx * 0.1 + 0.45);
        });
      } else if (type === 'scan') {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1760, t);
        osc.frequency.exponentialRampToValueAtTime(2637, t + 0.15);
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(t);
        osc.stop(t + 0.22);
      }
    }

    // Helper: Draw decorative QR Matrix

      ctx.fillStyle = '#0f172a';
      // Corners

      ctx.clearRect(x + 10, y + 10, 40, 40);
      ctx.fillRect(x + 20, y + 20, 20, 20);

      ctx.fillRect(x + w - 60, y, 60, 60);
      ctx.clearRect(x + w - 50, y + 10, 40, 40);
      ctx.fillRect(x + w - 40, y + 20, 20, 20);

      ctx.fillRect(x, y + h - 60, 60, 60);
      ctx.clearRect(x + 10, y + h - 50, 40, 40);
      ctx.fillRect(x + 20, y + h - 40, 20, 20);

      // Random-looking matrix dots
      const seed = 42;
      for (let r = 0; r < 14; r++) {
        for (let c = 0; c < 14; c++) {
          if ((r < 4 && c < 4) || (r < 4 && c > 9) || (r > 9 && c < 4)) continue;
          if ((r * 7 + c * 13 + seed) % 3 === 0) {
            ctx.fillRect(x + 65 + c * 7, y + 20 + r * 13, 6, 6);
          }
        }
      }
    }

    /* =========================================================================
       MAIN RENDER LOOP WITH KEN BURNS CAMERA TRANSFORM
       ========================================================================= */

    function render(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += dt;
        if (currentTime >= TOTAL_DURATION) {
          currentTime = TOTAL_DURATION;
          isPlaying = false;
          playBtn.textContent = '▶';
          centerPlayBtn.classList.remove('hidden');
        }
        seekSlider.value = currentTime;
        updateUI();
      }

      const scene = getCurrentScene(currentTime);
      const localT = currentTime - scene.start;
      const progress = Math.min(1.0, Math.max(0, localT / (scene.end - scene.start)));
      const easedT = easeInOutQuad(progress);

      // Calculate Ken Burns camera transformation
      const cam = scene.cam;
      const currentCamX = lerp(cam.from.x, cam.to.x, easedT);
      const currentCamY = lerp(cam.from.y, cam.to.y, easedT);
      const currentZoom = lerp(cam.from.zoom, cam.to.zoom, easedT);

      // Clear Canvas
      ctx.save();
      ctx.clearRect(0, 0, W, H);

      // Apply Camera Center & Zoom
      ctx.translate(W / 2, H / 2);
      ctx.scale(currentZoom, currentZoom);
      ctx.translate(-currentCamX, -currentCamY);

      // Render Scene
      if (scene.id === 'intro') renderSceneIntro(localT);
      else if (scene.id === 'student_login') renderSceneStudentLogin(localT);
      else if (scene.id === 'upload_supabase') renderSceneUploadSupabase(localT);
      else if (scene.id === 'print_options') renderScenePrintOptions(localT);
      else if (scene.id === 'payment_id') renderScenePaymentAndId(localT);
      else if (scene.id === 'admin_desk') renderSceneAdminDesk(localT);
      else if (scene.id === 'admin_status') renderSceneAdminStatus(localT);
      else if (scene.id === 'express_qr') renderSceneExpressQr(localT);
      else if (scene.id === 'superadmin') renderSceneSuperAdmin(localT);
      else if (scene.id === 'outro') renderSceneOutro(localT);

      ctx.restore();

      requestAnimationFrame(render);
    }

    // UI Updates

      const scene = getCurrentScene(currentTime);
      sceneTitle.textContent = scene.name;
      speakerNotesText.innerHTML = `<strong>Scene: ${scene.name}</strong> — ${scene.speaker}`;

      // Update Active Chip
      const chips = sceneChipsContainer.children;
      for (let i = 0; i < SCENES.length; i++) {
        if (SCENES[i].id === scene.id) chips[i].classList.add('active');
        else chips[i].classList.remove('active');
      }
    }

    function jumpToTime(time) {
      currentTime = Math.max(0, Math.min(TOTAL_DURATION, time));
      seekSlider.value = currentTime;
      updateUI();
      playSfx('click');

    function togglePlay() {
      initAudio();
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸' : '▶';
      if (isPlaying) {
        centerPlayBtn.classList.add('hidden');
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } else {
        centerPlayBtn.classList.remove('hidden');
      }
    }

    // Event Listeners
    playBtn.addEventListener('click', togglePlay);
    centerPlayBtn.addEventListener('click', togglePlay);
    canvas.addEventListener('click', togglePlay);

    rewindBtn.addEventListener('click', () => {
      jumpToTime(0);
      if (!isPlaying) togglePlay();
    });

    seekSlider.addEventListener('input', (e) => {
      jumpToTime(parseFloat(e.target.value));
    });

    musicToggleBtn.addEventListener('click', () => {
      initAudio();
      musicEnabled = !musicEnabled;
      musicToggleBtn.classList.toggle('active', musicEnabled);

    });

    volSlider.addEventListener('input', (e) => {
      if (masterGain && audioCtx) {
        masterGain.gain.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
      }
    });

    fullscreenBtn.addEventListener('click', () => {
      const wrapper = document.getElementById('screenWrapper');
      if (!document.fullscreenElement) {
        wrapper.requestFullscreen().catch(err => console.error(err));
      } else {
        document.exitFullscreen();
      }
    });

    /* =========================================================================
       EXPORT / DOWNLOAD VIDEO (MediaRecorder API)
       Combines 60 FPS Canvas Stream + Web Audio Synthesizer Destination
       ========================================================================= */
    let mediaRecorder = null;
    let recordedChunks = [];
    let isExporting = false;

    exportBtn.addEventListener('click', async () => {
      if (isExporting) return;
      initAudio();
      if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();

      const confirmExport = confirm('🎬 Ready to record and export the video demonstration?\n\nThis will restart from Scene 1, play through the entire presentation with audio, and automatically download "xeroxic-presentation-demo.webm".\n\nClick OK to begin recording!');
      if (!confirmExport) return;

      isExporting = true;
      recordedChunks = [];
      recBadge.style.display = 'inline-flex';
      exportBtn.disabled = true;
      exportBtn.textContent = '⏺ Recording Video...';

      // Rewind to 0
      currentTime = 0;
      isPlaying = true;
      playBtn.textContent = '⏸';
      centerPlayBtn.classList.add('hidden');

      // Capture Canvas at 60 FPS
      const canvasStream = canvas.captureStream(60);

      // Merge Audio if available
      let combinedStream = canvasStream;
      if (audioDestNode && audioDestNode.stream) {
        const audioTracks = audioDestNode.stream.getAudioTracks();
        if (audioTracks.length > 0) {
          combinedStream = new MediaStream([
            ...canvasStream.getVideoTracks(),
            ...audioTracks
          ]);
        }
      }

      // Check supported MIME type
      const mimeTypes = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm',
        'video/mp4'
      ];
      const selectedMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';

      mediaRecorder = new MediaRecorder(combinedStream, {
        mimeType: selectedMime,
        videoBitsPerSecond: 4000000 // 4 Mbps high definition
      });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        recBadge.style.display = 'none';
        isExporting = false;
        exportBtn.disabled = false;
        exportBtn.textContent = '⬇ Export Video (MP4/WebM)';

        const blob = new Blob(recordedChunks, { type: selectedMime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `xeroxic-presentation-demo-${new Date().toISOString().slice(0,10)}.webm`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        alert('🎉 Video export completed successfully! Your file has been downloaded.');
      };

      mediaRecorder.start();

      // Automatically stop recording when playback finishes
      const checkEndTimer = setInterval(() => {
        if (currentTime >= TOTAL_DURATION || !isPlaying) {
          clearInterval(checkEndTimer);
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
          }
        }
      }, 500);
    });

    // Initial setup
    updateUI();
    requestAnimationFrame(render);
  </script>
