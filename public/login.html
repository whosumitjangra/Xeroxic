<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Xerox Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><img src="logo.gif" alt="AIT Pune Logo"></div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Sign in to Xerox Centre — AIT, Pune</p>

    <form id="login-form">
      <label class="auth-label">Email</label>
      <input class="auth-input" type="email" id="email" placeholder="you@example.com" required>

      <label class="auth-label">Password</label>
      <input class="auth-input" type="password" id="password" placeholder="••••••••" required>

      <p class="auth-error" id="error-msg"></p>

      <button type="submit" class="auth-btn">Sign In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('error-msg');
  errorMsg.textContent = '';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errorMsg.textContent = data.error || 'Something went wrong.';
      return;
    }
    window.location.href = 'index.html';
  } catch (err) {
    errorMsg.textContent = 'Could not reach the server. Is it running?';
  }
});
</script>

</body>
</html>
