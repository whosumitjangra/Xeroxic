<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Xerox Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><img src="logo.gif" alt="AIT Pune Logo"></div>
    <h1 class="auth-title">Create Student Account</h1>
    <p class="auth-sub">Join Xerox Centre Student Printing Portal — AIT, Pune</p>

    <form id="signup-form">
      <label class="auth-label">Full Name</label>
      <input class="auth-input" type="text" id="name" placeholder="Your name" required autocomplete="name">

      <label class="auth-label">Email</label>
      <input class="auth-input" type="email" id="email" placeholder="student@aitpune.edu.in" required autocomplete="email">

      <label class="auth-label">Password</label>
      <input class="auth-input" type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">

      <p class="auth-error" id="error-msg"></p>

      <button type="submit" class="auth-btn" id="signup-submit-btn">Sign Up as Student</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    <p class="auth-switch" style="margin-top: 14px;">
      <a href="/admin" style="color: #556b5e; font-size: 13px; text-decoration: none;">🛡️ Staff or Admin? Sign in to Admin Portal →</a>
    </p>
  </div>
</div>

<script>
const submitBtn = document.getElementById('signup-submit-btn');
const nameInput = document.getElementById('name');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const errorMsg = document.getElementById('error-msg');

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  errorMsg.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Creating account...';

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, role: 'student' })
    });
    const data = await res.json();
    if (!res.ok) {
      errorMsg.textContent = data.error || 'Registration failed. Please try again.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign Up as Student';
      return;
    }
    
    // Always navigate to student portal
    window.location.href = '/';
  } catch (err) {
    errorMsg.textContent = 'Could not reach the server. Please check your connection.';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign Up as Student';
  }
});
</script>

</body>
</html>
