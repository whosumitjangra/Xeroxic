<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Xerox Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><img src="logo.gif" alt="AIT Pune Logo"></div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-sub">Join Xerox Centre — AIT, Pune</p>

    <!-- Role Switcher -->
    <div class="role-toggle-group">
      <button type="button" class="role-toggle-btn active" id="role-user-btn" data-role="user">
        🎓 Student
      </button>
      <button type="button" class="role-toggle-btn" id="role-admin-btn" data-role="admin">
        🛡️ Admin / Staff
      </button>
    </div>

    <form id="signup-form">
      <input type="hidden" id="selected-role" value="user">

      <label class="auth-label">Full Name</label>
      <input class="auth-input" type="text" id="name" placeholder="Your name" required>

      <label class="auth-label">Email</label>
      <input class="auth-input" type="email" id="email" placeholder="you@example.com" required>

      <label class="auth-label">Password</label>
      <input class="auth-input" type="password" id="password" placeholder="At least 6 characters" required minlength="6">

      <!-- Admin passcode field (revealed only if Admin is selected) -->
      <div id="admin-passcode-wrap" style="display: none;">
        <label class="auth-label">Admin Passcode <span style="font-weight:normal; font-size:12px; color:#a3b899;">(Default: AITXEROX2026)</span></label>
        <input class="auth-input" type="password" id="admin-passcode" placeholder="Enter staff passcode">
      </div>

      <p class="auth-error" id="error-msg"></p>

      <button type="submit" class="auth-btn" id="signup-submit-btn">Sign Up as Student</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<script>
const roleUserBtn = document.getElementById('role-user-btn');
const roleAdminBtn = document.getElementById('role-admin-btn');
const selectedRoleInput = document.getElementById('selected-role');
const submitBtn = document.getElementById('signup-submit-btn');
const adminPasscodeWrap = document.getElementById('admin-passcode-wrap');
const adminPasscodeInput = document.getElementById('admin-passcode');

function setRole(role) {
  selectedRoleInput.value = role;
  if (role === 'admin') {
    roleAdminBtn.classList.add('active');
    roleUserBtn.classList.remove('active');
    adminPasscodeWrap.style.display = 'block';
    adminPasscodeInput.required = true;
    submitBtn.textContent = 'Register as Admin';
    submitBtn.classList.add('admin-btn-highlight');
  } else {
    roleUserBtn.classList.add('active');
    roleAdminBtn.classList.remove('active');
    adminPasscodeWrap.style.display = 'none';
    adminPasscodeInput.required = false;
    adminPasscodeInput.value = '';
    submitBtn.textContent = 'Sign Up as Student';
    submitBtn.classList.remove('admin-btn-highlight');
  }
}

roleUserBtn.addEventListener('click', () => setRole('user'));
roleAdminBtn.addEventListener('click', () => setRole('admin'));

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const role = selectedRoleInput.value;
  const adminPasscode = adminPasscodeInput.value.trim();
  const errorMsg = document.getElementById('error-msg');
  errorMsg.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Creating account...';

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, role, adminPasscode })
    });
    const data = await res.json();
    if (!res.ok) {
      errorMsg.textContent = data.error || 'Something went wrong.';
      submitBtn.disabled = false;
      submitBtn.textContent = role === 'admin' ? 'Register as Admin' : 'Sign Up as Student';
      return;
    }
    
    if (data.redirect) {
      window.location.href = data.redirect;
    } else if (data.role === 'admin') {
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'index.html';
    }
  } catch (err) {
    errorMsg.textContent = 'Could not reach the server. Is it running?';
    submitBtn.disabled = false;
    submitBtn.textContent = role === 'admin' ? 'Register as Admin' : 'Sign Up as Student';
  }
});
</script>

</body>
</html>
