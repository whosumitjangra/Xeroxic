<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Xeroxic</title>
  
  <style>
    :root {
      --bg-screen: #f0f2f7;
      --bg-card: rgba(255, 255, 255, 0.97);
      --primary-green: #28ba5d;
      --primary-green-hover: #22a351;
      --link-blue: #1d68ed;
      --link-blue-hover: #1551be;
      --text-main: #111827;
      --text-muted: #6b7280;
      --input-bg: #edf2f7;
      --input-focus-border: #28ba5d;
      --border-radius-card: 18px;
      --border-radius-input: 10px;
      --border-radius-btn: 10px;
      --font-serif: 'MS Serif', 'Microsoft Serif', 'Times New Roman', Times, Georgia, serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-serif);
      background: #f4f8f4 url('/images/login-bg.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .signin-card {
      background: var(--bg-card);
      width: 100%;
      max-width: 440px;
      border-radius: var(--border-radius-card);
      padding: 44px 38px 36px;
      box-shadow: 
        0 14px 40px rgba(0, 0, 0, 0.08),
        0 2px 10px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.85);
    }

    .xeroxic-logo-wrapper {
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .xeroxic-logo-img {
      width: 140px;
      max-width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.04));
    }

    .signin-title {
      font-family: var(--font-serif);
      font-size: 1.95rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 24px;
      letter-spacing: -0.01em;
      text-align: center;
      line-height: 1.25;
    }

    .signin-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-field {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid transparent;
      border-radius: var(--border-radius-input);
      padding: 14px 16px;
      font-family: var(--font-serif);
      font-size: 1rem;
      color: #111827;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field::placeholder {
      color: #8c939d;
      font-weight: 400;
      font-family: var(--font-serif);
    }

    .input-field:focus {
      background: #ffffff;
      border-color: var(--input-focus-border);
      box-shadow: 0 0 0 3px rgba(40, 186, 93, 0.15);
    }

    .password-input-group {
      position: relative;
      width: 100%;
    }

    .password-input-group .input-field {
      padding-right: 44px;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      color: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 6px;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-green);
      color: #ffffff;
      border: none;
      border-radius: var(--border-radius-btn);
      padding: 13px 16px;
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-green-hover);
      box-shadow: 0 4px 14px rgba(40, 186, 93, 0.35);
    }

    .btn-submit:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .auth-error-banner {
      color: #ef4444;
      font-size: 0.88rem;
      font-family: var(--font-serif);
      text-align: center;
      display: none;
    }

    .auth-error-banner.visible {
      display: block;
    }

    .bottom-prompt-text {
      margin-top: 24px;
      font-size: 0.92rem;
      font-family: var(--font-serif);
      color: #1f2937;
      text-align: center;
    }

    .accent-link {
      color: var(--primary-green);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.15s ease;
      font-family: var(--font-serif);
    }

    .accent-link:hover {
      text-decoration: underline;
      color: var(--primary-green-hover);
    }

    @media (max-width: 480px) {
      .signin-card {
        padding: 34px 22px 28px;
      }
      .signin-title {
        font-size: 1.7rem;
      }
      .xeroxic-logo-img {
        width: 120px;
      }
    }
  </style>
</head>
<body>

  <div class="signin-card">
    
    <div class="xeroxic-logo-wrapper">
      <img src="/images/xeroxic-logo.png" alt="XEROXIC" class="xeroxic-logo-img">
    </div>

    <h1 class="signin-title">Create account</h1>

    <form class="signin-form" id="signupForm" onsubmit="handleSignup(event)">
      <input 
        type="text" 
        class="input-field" 
        id="nameInput" 
        placeholder="Full Name" 
        required 
        autocomplete="name"
        autofocus
      >

      <input 
        type="email" 
        class="input-field" 
        id="emailInput" 
        placeholder="Email" 
        required 
        autocomplete="email"
      >

      <div class="password-input-group">
        <input 
          type="password" 
          class="input-field" 
          id="passwordInput" 
          placeholder="Password (at least 6 chars)" 
          required 
          minlength="6"
          autocomplete="new-password"
        >
        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <p class="auth-error-banner" id="errorBanner"></p>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>Create account</span>
      </button>
    </form>

    <p class="bottom-prompt-text">
      Already have an account? <a href="login.html" class="accent-link">Sign in</a>
    </p>

  </div>

  <script>
    const nameInput = document.getElementById('nameInput');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const errorBanner = document.getElementById('errorBanner');
    const btnSubmit = document.getElementById('btnSubmit');

    function togglePasswordVisibility() {
      const eyeIcon = document.getElementById('eyeIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      errorBanner.textContent = '';
      errorBanner.classList.remove('visible');

      if (!name || !email || !password) {
        errorBanner.textContent = 'Please fill out all fields.';
        errorBanner.classList.add('visible');
        return;
      }

      if (password.length < 6) {
        errorBanner.textContent = 'Password must be at least 6 characters.';
        errorBanner.classList.add('visible');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>Creating account...</span>';

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role: 'student' })
        });
        const data = await res.json();

        if (!res.ok) {
          errorBanner.textContent = data.error || 'Registration failed. Please try again.';
          errorBanner.classList.add('visible');
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<span>Create account</span>';
          return;
        }

        btnSubmit.innerHTML = '<span>✓ Account Created!</span>';
        window.location.href = '/';
      } catch (err) {
        errorBanner.textContent = 'Could not reach server. Please check your connection.';
        errorBanner.classList.add('visible');
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Create account</span>';
      }
    }
  </script>
</body>
</html>
